<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="55" y="55" font-family="Arial" font-size="29" font-weight="700">Методика: 7 критериев, 100%</text><text x="55" y="130" font-family="Arial" font-size="18" font-weight="700">C1</text><text x="105" y="130" font-family="Arial" font-size="17">Одна локация / время</text><rect x="430" y="108" width="575" height="28" fill="#d9d9d9"/><text x="1020" y="130" font-family="Arial" font-size="17" font-weight="700">25%</text><text x="55" y="200" font-family="Arial" font-size="18" font-weight="700">C2</text><text x="105" y="200" font-family="Arial" font-size="17">Возраст и пол</text><rect x="430" y="178" width="460" height="28" fill="#d9d9d9"/><text x="905" y="200" font-family="Arial" font-size="17" font-weight="700">20%</text><text x="55" y="270" font-family="Arial" font-size="18" font-weight="700">C3</text><text x="105" y="270" font-family="Arial" font-size="17">Регулярная стоимость</text><rect x="430" y="248" width="345" height="28" fill="#d9d9d9"/><text x="790" y="270" font-family="Arial" font-size="17" font-weight="700">15%</text><text x="55" y="340" font-family="Arial" font-size="18" font-weight="700">C4</text><text x="105" y="340" font-family="Arial" font-size="17">Инвентарь</text><rect x="430" y="318" width="230" height="28" fill="#d9d9d9"/><text x="675" y="340" font-family="Arial" font-size="17" font-weight="700">10%</text><text x="55" y="410" font-family="Arial" font-size="18" font-weight="700">C5</text><text x="105" y="410" font-family="Arial" font-size="17">Общие соревнования</text><rect x="430" y="388" width="345" height="28" fill="#d9d9d9"/><text x="790" y="410" font-family="Arial" font-size="17" font-weight="700">15%</text><text x="55" y="480" font-family="Arial" font-size="18" font-weight="700">C6</text><text x="105" y="480" font-family="Arial" font-size="17">Гибкость</text><rect x="430" y="458" width="230" height="28" fill="#d9d9d9"/><text x="675" y="480" font-family="Arial" font-size="17" font-weight="700">10%</text><text x="55" y="550" font-family="Arial" font-size="18" font-weight="700">C7</text><text x="105" y="550" font-family="Arial" font-size="17">Младший ребенок</text><rect x="430" y="528" width="115" height="28" fill="#d9d9d9"/><text x="560" y="550" font-family="Arial" font-size="17" font-weight="700">5%</text><text x="55" y="635" font-family="Arial" font-size="13">Каждый вид спорта кодируется 0–10, затем raw-балл умножается на вес критерия.</text></svg>