<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="60" y="65" font-family="Arial" font-size="30" font-weight="700">Модель семьи и горизонт 3 года</text>
<g font-family="Arial" text-anchor="middle">
<text x="180" y="125" font-size="18" font-weight="700">Сейчас</text>
<circle cx="180" cy="220" r="58" fill="#eee" stroke="#111"/><text x="180" y="226" font-size="24" font-weight="700">11</text>
<circle cx="360" cy="220" r="50" fill="#eee" stroke="#111"/><text x="360" y="226" font-size="22" font-weight="700">8</text>
<circle cx="520" cy="220" r="44" fill="#eee" stroke="#111"/><text x="520" y="226" font-size="20" font-weight="700">5</text>
<circle cx="660" cy="220" r="38" fill="#eee" stroke="#111"/><text x="660" y="214" font-size="16" font-weight="700">младший</text><text x="660" y="236" font-size="13">в коляске</text>
<text x="180" y="390" font-size="18" font-weight="700">Через 3 года</text>
<circle cx="180" cy="485" r="58" fill="#111"/><text x="180" y="492" font-size="24" font-weight="700" fill="#fff">14</text>
<circle cx="360" cy="485" r="50" fill="#111"/><text x="360" y="492" font-size="22" font-weight="700" fill="#fff">11</text>
<circle cx="520" cy="485" r="44" fill="#111"/><text x="520" y="492" font-size="20" font-weight="700" fill="#fff">8</text>
<circle cx="660" cy="485" r="38" fill="#111"/><text x="660" y="492" font-size="18" font-weight="700" fill="#fff">3</text>
</g>
<path d="M750 220 H1070 M750 485 H1070" stroke="#111" stroke-width="3"/>
<text x="910" y="190" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Проверка рейтинга</text>
<text x="910" y="225" text-anchor="middle" font-family="Arial" font-size="17">Нужно ли семье собирать</text><text x="910" y="250" text-anchor="middle" font-family="Arial" font-size="17">новую инфраструктуру заново?</text>
<text x="910" y="455" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Сильная система</text>
<text x="910" y="490" text-anchor="middle" font-family="Arial" font-size="17">Возраст меняется,</text><text x="910" y="515" text-anchor="middle" font-family="Arial" font-size="17">семейный маршрут сохраняется</text></svg>